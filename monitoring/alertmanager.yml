global:
  resolve_timeout: 5m

route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: false
    
    - match:
        severity: warning
      receiver: 'slack-warning'
      continue: false

receivers:
  - name: 'default-receiver'
    # Fallback receiver if no severity matches
  
  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_INTEGRATION_KEY' # Replace with actual PagerDuty routing key
        description: '{{ template "pagerduty.default.description" . }}'

  - name: 'slack-warning'
    slack_configs:
      - api_url: 'http://slack-webhook-placeholder' # Replace with actual slack_webhook URL
        channel: '#slr-alerts-warning'
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.SortedPairs.Values | join " " }}'
        text: >-
          {{ range .Alerts -}}
          *Alert:* {{ .Annotations.title }}{{ if .Labels.severity }} - `{{ .Labels.severity }}`{{ end }}
          *Description:* {{ .Annotations.description }}
          *Details:*
            {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
            {{ end }}
          {{ end }}
