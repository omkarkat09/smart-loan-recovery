apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-recovery-api
  namespace: default
  labels:
    app: loan-recovery-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: loan-recovery-api
  template:
    metadata:
      labels:
        app: loan-recovery-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/smart-loan-recovery:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7860
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 7860
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 7860
            initialDelaySeconds: 15
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: slr-config
            - secretRef:
                name: slr-secrets
